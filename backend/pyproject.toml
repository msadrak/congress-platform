[project]
name = "congress-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "pillow>=13.0.0",
    "httpx>=0.28",
    "cryptography>=43",
    # Monitoring (app/observability.py): /api/metrics and optional Sentry/GlitchTip error reporting.
    "prometheus-client>=0.21",
    "sentry-sdk>=2.19",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "mypy>=2.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = "asyncpg"
ignore_missing_imports = true

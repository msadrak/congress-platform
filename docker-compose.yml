services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: congress
      POSTGRES_PASSWORD: congress
      POSTGRES_DB: congress
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U congress"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:

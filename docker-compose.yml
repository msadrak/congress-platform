# Local dev: PostgreSQL only (integration tests / backend against port 5433).
# Data on the host, same layout as deploy/staging/compose.yaml (DrGibi-style).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: congress
      POSTGRES_PASSWORD: congress
      POSTGRES_DB: congress
    ports:
      # Loopback only: the password above is public, so the database must not be reachable from the network.
      - "127.0.0.1:5433:5432"
    volumes:
      - ${CONGRESS_PERSISTENT_DATA_ROOT:-${HOME}/congress-persistent-data}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U congress"]
      interval: 2s
      timeout: 3s
      retries: 20

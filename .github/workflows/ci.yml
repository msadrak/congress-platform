name: CI

on:
  push:
    # integration/** collects the workstream (ws/**) branches before main. ws/** branches are not built on push,
    # to save Actions minutes; open a pull request or run the workflow by hand (Actions → CI → Run workflow).
    branches: [master, main, 'integration/**', 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the running checks.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a full commit SHA (the release is in the trailing comment): a tag can be moved,
# a commit cannot. Dependabot (.github/dependabot.yml, github-actions) proposes new SHAs and updates the comments.

jobs:
  backend:
    name: Backend (FastAPI & PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: congress
          POSTGRES_PASSWORD: congress
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install 3.11

      # --locked: fail when backend/uv.lock no longer matches pyproject.toml instead of silently re-resolving.
      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Strict Mypy Typecheck
        working-directory: backend
        run: uv run --locked mypy

      - name: Pytest Suite
        working-directory: backend
        # The suite builds its own settings and targets the disposable `congress_test` database on
        # 127.0.0.1:5433 (tests/conftest.py); no CONGRESS_DATABASE_URL is needed or consulted.
        run: uv run --locked pytest -v

  web:
    name: Web Frontend (React & TypeScript)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run unit tests
        working-directory: web
        run: npm test

      - name: Strict TypeScript typecheck
        working-directory: web
        run: npm run typecheck

      - name: Production Vite build
        working-directory: web
        run: npm run build

      - name: Lint (oxlint, warnings fail)
        working-directory: web
        run: npm run lint

      - name: Operations tool unit tests (scripts/staging)
        run: node --test scripts/staging/stack.test.mjs

  api-schema:
    name: API client types match the backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install 3.11

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: web/src/api/schema.d.ts matches the backend
        run: node scripts/gen-api.mjs --check

  mobile:
    name: Mobile (Flutter / Dart)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The same Dart release as scripts/check.sh (CONGRESS_DART_IMAGE default dart:3.13.5).
      - name: Set up Dart SDK
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.13.5

      - name: Install dependencies
        working-directory: mobile
        run: dart pub get

      - name: Run Dart unit tests
        working-directory: mobile
        run: dart test

      - name: Dart static analysis
        working-directory: mobile
        run: dart analyze lib/models lib/services test

  e2e:
    name: Browser end-to-end (Playwright, intercepted API)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Production Vite build
        working-directory: web
        run: npm run build

      # Every spec in web/e2e runs against the production build served by `vite preview` (CONGRESS_E2E_PREVIEW)
      # in Playwright's Chromium (CONGRESS_BROWSER_CHANNEL; locally the default is Edge). They intercept /api/
      # with synthetic responses, so no backend is needed. The journeys against a real API are the live-e2e job.
      # scanner-real-api.spec.ts needs a live FastAPI + PostgreSQL and CONGRESS_PLATFORM_ADMIN_TOKEN; without the
      # token it reports itself skipped. It runs in scripts/integration/congress-e2e.mjs.
      # One retry (not the config's two): a test that passes only on its retry is reported as flaky by the next
      # step (warning annotation + job summary) and must be fixed, not left to the retry.
      - name: Playwright specs
        working-directory: web
        env:
          CONGRESS_BROWSER_CHANNEL: chromium
          CONGRESS_E2E_PREVIEW: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/playwright-report.json
        run: npx playwright test --retries=1 --reporter=list,json

      - name: Flaky test report
        if: success() || failure()
        run: node .github/scripts/playwright-flaky.mjs "$RUNNER_TEMP/playwright-report.json"

      - name: Upload failure context
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-test-results
          path: web/test-results
          retention-days: 7

  live-e2e:
    name: Browser journeys (Playwright, live API & PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Type-check the live specs
        working-directory: web
        run: npx tsc -p tsconfig.e2e-live.json

      # A disposable PostgreSQL + API (backend test image, built here on first use) and the production build behind
      # vite preview; every persona journey in web/e2e-live runs against it, then everything is removed.
      - name: Live journeys
        env:
          CONGRESS_BROWSER_CHANNEL: chromium
        run: node scripts/integration/live-e2e.mjs

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-live-report
          path: |
            web/playwright-live-report
            web/test-results-live
          retention-days: 7

  images:
    name: Docker images and Caddy configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build the API image (backend/Dockerfile)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build the web edge image (deploy/web/Dockerfile)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # PostgreSQL + pgBackRest for WAL archiving / point-in-time recovery (deploy/staging/compose.wal.yaml).
      - name: Build the database image (deploy/db/Dockerfile)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: deploy/db
          file: deploy/db/Dockerfile
          push: false
          cache-from: type=gha,scope=db
          cache-to: type=gha,mode=max,scope=db

      # caddy validate in the official image for each edge mode (local staging, LAN, hosted, CDN in front).
      - name: Validate deploy/staging/Caddyfile
        run: node scripts/ci/validate-caddyfile.mjs

  compose-smoke:
    name: Staging stack smoke (compose init, up, check, probes, down)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Fresh secrets in .staging/staging.env; persistent data in the runner's temporary folder.
      - name: stack.mjs init
        run: |
          node scripts/staging/stack.mjs init
          sed -i "s#^CONGRESS_PERSISTENT_DATA_ROOT=.*#CONGRESS_PERSISTENT_DATA_ROOT=$RUNNER_TEMP/congress-data#" .staging/staging.env

      - name: stack.mjs up (build, migrate, start, wait until healthy)
        run: node scripts/staging/stack.mjs up

      # Exit 0 = ok, 1 = warning (acceptable on a fresh stack, e.g. no backup taken yet), 2 = critical.
      - name: stack.mjs check
        run: |
          set +e
          node scripts/staging/stack.mjs check
          rc=$?
          echo "check exit $rc"
          test "$rc" -le 1

      - name: HTTP probes through Caddy
        run: |
          set -euo pipefail
          http=http://localhost:18080
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          curl -fsS "$http/api/health"
          curl -fsS "$http/api/ready" | grep -q '"ready"'
          test "$(code "$http/")" = 200
          test "$(code "$http/organizer")" = 200
          test "$(code "$http/api/public/events/no-such-congress")" = 404
          curl -fsS -o /dev/null -D - "$http/" | grep -qi '^content-security-policy:'
          test "$(code -k https://localhost:8443/api/ready)" = 200
          echo "probes ok"

      - name: Logs on failure
        if: failure()
        run: node scripts/staging/stack.mjs logs

      - name: Tear down
        if: always()
        run: |
          if [ -f .staging/staging.env ]; then
            docker compose -p congress-staging --env-file .staging/staging.env -f deploy/staging/compose.yaml down --remove-orphans
          fi

  load-scripts:
    name: Load test scripts compile (k6 inspect)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Every scripts/load/*.js scenario in the pinned grafana/k6 image (scripts/load/k6.mjs); no stack needed.
      - name: k6 inspect scripts/load/*.js
        run: node scripts/load/k6.mjs inspect

  audit:
    name: Dependency audit (high and critical fail)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Runtime dependencies from backend/uv.lock (what the API image ships). pip-audit exits non-zero on any
      # finding; the gate looks up each advisory's severity in OSV and fails on high or critical only.
      - name: Python (pip-audit over backend/uv.lock)
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --disable-pip --requirement "$RUNNER_TEMP/requirements.txt" --progress-spinner off \
            --format json --output "$RUNNER_TEMP/pip-audit.json" || true
          node ../scripts/ci/pip-audit-gate.mjs "$RUNNER_TEMP/pip-audit.json"

      - name: Web (npm audit, production dependencies)
        if: success() || failure()
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

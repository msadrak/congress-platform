name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    name: Backend (FastAPI & PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: congress
          POSTGRES_PASSWORD: congress
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        working-directory: backend
        run: uv sync

      - name: Strict Mypy Typecheck
        working-directory: backend
        run: uv run mypy

      - name: Pytest Suite
        working-directory: backend
        # The suite builds its own settings and targets the disposable `congress_test` database on
        # 127.0.0.1:5433 (tests/conftest.py); no CONGRESS_DATABASE_URL is needed or consulted.
        run: uv run pytest -v

  web:
    name: Web Frontend (React & TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run unit tests
        working-directory: web
        run: npm test

      - name: Strict TypeScript typecheck
        working-directory: web
        run: npm run typecheck

      - name: Production Vite build
        working-directory: web
        run: npm run build

  mobile:
    name: Mobile (Flutter / Dart)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        working-directory: mobile
        run: dart pub get

      - name: Run Dart unit tests
        working-directory: mobile
        run: dart test

      - name: Dart static analysis
        working-directory: mobile
        run: dart analyze lib/models lib/services test
